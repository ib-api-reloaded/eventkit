# Git hooks: install once with `uvx pre-commit install`.
# Ruff and mypy run through the Makefile, i.e. the versions pinned in
# pyproject.toml and the exact checks CI runs.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-toml
  - repo: local
    hooks:
      - id: ruff
        name: ruff (make ruff)
        entry: make ruff
        language: system
        pass_filenames: false
        types: [python]
      - id: mypy
        name: mypy (make typecheck)
        entry: make typecheck
        language: system
        pass_filenames: false
        types: [python]
