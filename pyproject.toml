[project]
name = "aeventkit"
version = "3.0.0"
description = "Event-driven data pipelines"
readme = "README.rst"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Ewald R. de Wit" }]
keywords = ["python", "asyncio", "event", "driven", "data", "pipelines"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ib-api-reloaded/eventkit"
Repository = "https://github.com/ib-api-reloaded/eventkit"
"Bug Tracker" = "https://github.com/ib-api-reloaded/eventkit/issues"

[project.optional-dependencies]
# numpy has no wheel for PyPy 3.12. The extra is empty there, and the
# tests that need numpy skip.
numpy = ["numpy>=2.4.4,<3.0.0; implementation_name != 'pypy' or python_version != '3.12'"]

[dependency-groups]
# What the tests need, and nothing else: `make test` installs only this
# group, so the tests also run where the lint tools have no wheels (PyPy).
test = [
    # hypothesis 6.156 and later ship compiled wheels, and none is for PyPy
    # 3.12. The last version with a PyPy 3.12 wheel is 6.155.7.
    "hypothesis>=6.100,<7; implementation_name != 'pypy' or python_version != '3.12'",
    "hypothesis==6.155.7; implementation_name == 'pypy' and python_version == '3.12'",
    "pytest>=8.4.1,<9.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "pytest-timeout>=2.3.1,<3.0.0",
]
dev = [
    "ruff>=0.17.0,<0.18.0",
    "mypy>=1.20.0,<2.0.0",
    { include-group = "test" },
]
docs = [
    "sphinx>=8.1.0",
    "sphinx-autodoc-typehints>=3.0.0,<4.0.0",
    "sphinx-rtd-theme>=2.0.0,<4.0.0",
]

[build-system]
requires = ["uv_build>=0.10.10,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Published as `aeventkit` but imported as `eventkit`, from the repo root.
module-name = "eventkit"
module-root = ""
# Local tool output that can sit inside the package directory.
wheel-exclude = ["**/.DS_Store", "**/.ruff_cache", "**/.mypy_cache", "eventkit/tags"]
source-exclude = ["**/.DS_Store", "**/.ruff_cache", "**/.mypy_cache", "eventkit/tags"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Listed explicitly so a ruff upgrade never changes what is checked.
select = [
  # pycodestyle errors and pyflakes (ruff's long-standing defaults)
  "E4",
  "E7",
  "E9",
  "F",
  # convert legacy python syntax to modern syntax
  "UP",
  # isort imports
  "I",
  # simplifications
  "SIM",
  # pathlib over os.path / open()
  "PTH",
  # modern idioms (refurb)
  "FURB",
  # specific ignore / type-ignore codes
  "PGH",
]
ignore = [
  "E402", # event.py imports the operators at the bottom (circular import)
  "SIM102", # collapsible-if: nested ifs often read clearer
  "SIM110", # reimplemented-builtin: explicit loops often read clearer
]

[tool.pytest.ini_options]
asyncio_default_test_loop_scope = "session"

[tool.mypy]
# Check every function body, annotated or not.
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["numpy"]
ignore_missing_imports = true

[tool.releasekit]
import-name = "eventkit"
smoke = "eventkit.Event('smoke').emit(1)"
checks = ["make lint", "make test"]
changelog = { path = "docs/changelog.rst", contains = "Version {version}", forbid = "Version {version} (Unreleased)" }

[tool.releasekit.matrix]
python = ["3.11", "3.12", "3.13", "3.14", "3.15", "pypy3.11", "pypy3.12"]
command = "make test"
timeout = 300
